<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF7EF">
<title>乐高积分</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='36' width='84' height='56' rx='14' fill='%23EE6F5F'/><circle cx='34' cy='36' r='13' fill='%23EE6F5F'/><circle cx='66' cy='36' r='13' fill='%23EE6F5F'/></svg>">
<style>
/* ===== v4：安静温暖的绘本底子 + 少而精的积木玩具感 =====
   纪律：颜色/字号/圆角/间距一律走 token；无 emoji；凸点只存在于
   总积分卡徽章、登录 logo、tabBar 首页图标、空状态插画 4 处；
   凸点画法 = inset 阴影 + 白点高光（禁止 radial-gradient）。 */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* —— 中性（占页面 ~60%）—— */
  --bg:#FBF7EF;
  --card:#FFFFFF;
  --ink:#4A4238;
  --ink2:#8F8578;
  --ink3:#BDB3A4;
  --line:#F0EADC;
  --fill:#F6F1E7;
  --overlay:rgba(74,66,56,.4);
  /* —— 四积木色（马卡龙化，占页面 ~10%）—— */
  --red:#EE6F5F;   --red-deep:#C9503F;  --red-l:#FCEDE9;
  --yellow:#F4B942;--yel-deep:#8F6210;  --yellow-l:#FCF3DC;
  --blue:#6FA6D8;  --blue-deep:#3C72A4; --blue-l:#EAF2FA;
  --green:#63BD87; --grn-deep:#337E55;  --green-l:#E8F5EC;
  /* —— 品牌主色别名 —— */
  --primary:var(--red);--primary-deep:var(--red-deep);--primary-l:var(--red-l);
  /* —— 字号阶梯（8 级）—— */
  --ff:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --f-hero:800 44px/1.1 var(--ff);
  --f-title:700 20px/1.3 var(--ff);
  --f-h2:700 17px/1.4 var(--ff);
  --f-body:400 15px/1.5 var(--ff);
  --f-item:400 13px/1.5 var(--ff);
  --f-cap:400 11px/1.4 var(--ff);
  --f-mini:500 10px/1.2 var(--ff);
  --f-display:800 26px/1.3 var(--ff); /* 登录页标题（§4.15：f-title 放大至 26px 800） */
  /* —— 圆角（3 档 + 胶囊）—— */
  --r-s:10px;--r-m:16px;--r-l:22px;--r-full:999px;
  /* —— 阴影与描边 —— */
  --sh-card:0 1px 2px rgba(74,66,56,.04),0 4px 14px rgba(74,66,56,.05);
  --sh-cta:0 4px 14px rgba(238,111,95,.28);
  --bd:1px solid var(--line);
}
body{font:var(--f-body);background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:72px;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:0}

/* —— 通用积木凸点画法：inset 阴影 + ::after 白点高光 —— */
.studi{display:block;width:10px;height:10px;border-radius:var(--r-full);position:relative;background:var(--red);box-shadow:inset 0 -2px 2px rgba(0,0,0,.18),inset 0 2px 2px rgba(255,255,255,.35)}
.studi::after{content:'';position:absolute;top:1px;right:1px;width:2px;height:2px;border-radius:var(--r-full);background:var(--card);opacity:.5}
.studi.y{background:var(--yellow)}
.studi.b{background:var(--blue)}

/* —— 顶栏：与页面同底色，滚动才浮现描边 —— */
.header{background:var(--bg);color:var(--ink);padding:12px 16px;position:sticky;top:0;z-index:100;border-bottom:1px solid transparent;transition:background .2s,border-color .2s}
.header.scrolled{background:var(--card);border-bottom-color:var(--line)}
.header h1{font:var(--f-title);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.header .sub{text-align:center;font:var(--f-cap);color:var(--ink2);margin-top:2px}
.logo-brick{position:relative;display:inline-block;width:12px;height:9px;border-radius:var(--r-s);background:var(--red);box-shadow:inset 0 -2px 0 rgba(0,0,0,.10)}
.logo-brick::before,.logo-brick::after{content:'';position:absolute;top:1px;width:3px;height:3px;border-radius:var(--r-full);background:var(--red);box-shadow:inset 0 -1px 1px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.35)}
.logo-brick::before{left:2px}
.logo-brick::after{right:2px}
/* —— 用户切换胶囊：白底描边，同步状态合并为 6px 色点 —— */
.user-switch{position:absolute;top:10px;right:16px;background:var(--card);border:var(--bd);border-radius:var(--r-full);padding:4px 12px;color:var(--ink);font:var(--f-item);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:transform .15s;z-index:50}
.user-switch:active{transform:scale(.95)}
.sync-dot{width:6px;height:6px;height:6px;border-radius:var(--r-full);background:var(--line);flex-shrink:0}
.sync-dot.ok{background:var(--green)}
.sync-dot.wait{background:var(--yellow)}
.sync-dot.err{background:var(--red)}
.sync-dot.off{background:var(--line)}
.us-avatar{width:20px;height:20px;border-radius:var(--r-full);background:var(--blue-l);color:var(--blue-deep);display:flex;align-items:center;justify-content:center;font:var(--f-mini)}

/* —— 页面区块节奏 —— */
.pg{display:none}
.pg.on{display:block}
.sec{padding:0 16px;margin-top:24px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.st-t{flex:1;font:var(--f-cap);font-weight:500;color:var(--ink2)}

/* —— 总积分卡：首页唯一大彩点 —— */
.pc{background:var(--card);border:var(--bd);border-radius:var(--r-l);box-shadow:var(--sh-card);margin:12px 16px 0;padding:24px 16px 20px;text-align:center;position:relative}
.pc .lb{font:var(--f-cap);font-weight:500;color:var(--ink2);letter-spacing:2px}
.pc .pts{font:var(--f-hero);font-variant-numeric:tabular-nums;color:var(--ink);margin-top:4px}
.pc .pts.zero{color:var(--ink3)}
.pc .td{font:var(--f-cap);margin-top:4px;color:var(--ink2)}
.pc .td .up{color:var(--grn-deep);font-weight:700}
.pc .td .down{color:var(--red-deep);font-weight:700}
/* 右上角积木徽章：全 App 唯一「精致凸点」装饰 */
.pc-brick{position:absolute;top:16px;right:16px;display:grid;grid-template-columns:repeat(2,10px);grid-template-rows:repeat(2,10px);gap:4px 8px;padding:4px 8px;border-radius:var(--r-s);background:var(--red);box-shadow:inset 0 -3px 0 rgba(0,0,0,.10)}
.pc-brick.y{background:var(--yellow)}
.pc-brick.b{background:var(--blue)}
.pc-brick .studi{width:10px;height:10px}
.pc-brick.y .studi{background:var(--yellow)}
.pc-brick.b .studi{background:var(--blue)}

/* —— 统计三宫格：数字即信息，无图标块、无阴影 —— */
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px;margin-top:12px}
.sc{background:var(--card);border:var(--bd);border-radius:var(--r-m);padding:12px 8px;text-align:center}
.sc .sv{font:var(--f-h2);font-variant-numeric:tabular-nums;color:var(--ink)}
.qs .sc:nth-child(1) .sv{color:var(--grn-deep)}
.qs .sc:nth-child(2) .sv{color:var(--red-deep)}
.sc .sl{font:var(--f-cap);color:var(--ink2);margin-top:4px}

/* —— 周概览条：7 格，今日红描边，有记录格底部色条 —— */
.wb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sbd{position:relative;height:62px;border:var(--bd);border-radius:var(--r-s);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.sbd:active{transform:scale(.94)}
.sdl{font:500 9px/1.2 var(--ff);color:var(--ink2)}
.sdd{font:600 11px/1.2 var(--ff);color:var(--ink);font-variant-numeric:tabular-nums;margin-top:1px}
.sds{font:600 13px/1.2 var(--ff);margin-top:3px;font-variant-numeric:tabular-nums}
.sbd.tdy{border:1.5px solid var(--red);background:var(--red-l)}
.sbd.tdy .sdl,.sbd.tdy .sdd{color:var(--red-deep)}
.sdbar{position:absolute;left:0;right:0;bottom:0;height:3px}

/* —— 主操作区：记录+兑换同行并排（v3 交互结构）——
   用户要求恢复 v3 的两按钮同一行；样式仍走 v4 token：
   记录 = 红主按钮（--sh-cta），兑换 = 黄次按钮，半宽同高 48px。 */
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cta{display:block;width:100%;height:48px;border:none;border-radius:var(--r-m);background:var(--red);color:var(--card);font:var(--f-body);font-weight:700;cursor:pointer;box-shadow:var(--sh-cta);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta2{display:block;width:100%;height:48px;border:none;border-radius:var(--r-m);background:var(--yellow-l);color:var(--yel-deep);font:var(--f-body);font-weight:700;cursor:pointer;transition:transform .15s}
.cta2:active{transform:scale(.97)}

/* —— 记录列表行：类别色点 + 名称/时间 + 分值 —— */
.rl{display:flex;flex-direction:column;gap:8px}
.ri{background:var(--card);border:var(--bd);border-radius:var(--r-m);padding:12px 16px;display:flex;align-items:center;gap:12px}
.ri:active{transform:scale(.985)}
.cat-dot{width:8px;height:8px;border-radius:var(--r-full);flex-shrink:0}
.ri .inf{flex:1;min-width:0}
.ri .nm{font:var(--f-item);font-weight:600;color:var(--ink)}
.ri .tm{font:var(--f-cap);color:var(--ink3);margin-top:2px}
.sc2{font:var(--f-body);font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
.sc2.u{color:var(--grn-deep)}
.sc2.d{color:var(--red-deep)}
.sc2.e{color:var(--yel-deep)}
.ex-chip{font:var(--f-cap);font-weight:500;color:var(--yel-deep);background:var(--yellow-l);border-radius:var(--r-full);padding:4px 8px;flex-shrink:0}
.dl{width:32px;height:32px;border:none;border-radius:var(--r-s);background:transparent;color:var(--ink3);font:var(--f-item);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:-8px}
.dl:active{background:var(--fill);color:var(--red-deep)}

/* —— 记录页：日期条（白卡中性）+ 筛选 tabs（蓝浅底选中）—— */
.dtrig{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:var(--bd);border-radius:var(--r-m);padding:12px 16px;margin:12px 16px 0;cursor:pointer}
.dtrig-t{font:var(--f-item);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dtrig-c{color:var(--ink2);font:var(--f-body)}
.ft{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ft::-webkit-scrollbar{display:none}
.ftb{padding:8px 16px;border-radius:var(--r-full);font:var(--f-item);white-space:nowrap;cursor:pointer;background:var(--card);border:var(--bd);color:var(--ink2);transition:all .2s;user-select:none}
.ftb.on{background:var(--blue-l);border-color:var(--blue-l);color:var(--blue-deep);font-weight:600}
.ftb.sm{padding:4px 12px;font:var(--f-cap)}

/* —— 设置页：v3 结构（分组卡可折叠 + 组内按分类再分组），v4 皮肤 —— */
.sg{background:var(--card);border:var(--bd);border-radius:var(--r-m);margin-bottom:12px;overflow:hidden}
.sgh{padding:16px 16px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:border-color .2s}
.sgh.open{border-bottom-color:var(--line)}
.sgt{flex:1;font:var(--f-item);font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px}
.gh-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.10)}
.cnt{font:var(--f-cap);font-weight:500;color:var(--ink2);background:var(--fill);border-radius:var(--r-full);padding:4px 8px}
/* 折叠箭头：CSS chevron（非 emoji 字符），open 时旋转指向上 */
.sgh .arr{width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .2s;flex-shrink:0}
.sgh.open .arr{transform:rotate(-135deg)}
/* 可折叠内容区：max-height 过渡，折叠机制照 v3（.open 切换，无持久化） */
.sgc{max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease}
.sgc.open{max-height:2000px;padding:10px 16px 0}
/* 组内分类小节：嵌套卡片（v3 renderGroupedItems 结构） */
.sg-sub{margin-bottom:8px;border-radius:var(--r-s)}
.sg-sub>.sgh{padding:10px 12px}
.sg-sub .sgt{font-size:13px}
.sg-sub>.sgc.open{max-height:2000px;padding:2px 12px 8px}
.add-inline{display:block;width:calc(100% - 32px);margin:8px 16px 16px;height:40px;background:var(--fill);border:1.5px dashed var(--line);border-radius:var(--r-s);color:var(--ink);font:var(--f-item);font-weight:600;cursor:pointer}
.add-inline:active{background:var(--blue-l)}
.sr{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:var(--r-s);padding:8px 12px;margin-bottom:8px}
.sr .n{flex:1;font:var(--f-item);color:var(--ink);word-break:break-all}
.sr .s{font:var(--f-item);font-weight:600;font-variant-numeric:tabular-nums;width:44px;text-align:right;flex-shrink:0}
.sr .s.u{color:var(--grn-deep)}
.sr .s.d{color:var(--red-deep)}
.sr .s.e{color:var(--yel-deep)}
.sr .x,.sr .ed{width:32px;height:32px;border-radius:var(--r-s);background:var(--card);border:none;color:var(--ink2);font:var(--f-item);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sr .x:active{color:var(--red-deep)}
.bn-danger{display:block;width:100%;height:44px;background:var(--card);border:1px solid var(--red);border-radius:var(--r-s);color:var(--red-deep);font:var(--f-body);font-weight:600;cursor:pointer}
.bn-danger:active{background:var(--red-l)}
/* —— 云端同步区块（设置页，非折叠，状态行走色点语言）—— */
.sync-hint{font:var(--f-cap);color:var(--ink3)}
.sync-line{display:flex;align-items:center;gap:6px;margin-top:10px;font:var(--f-cap);color:var(--ink2)}
.sync-line .sync-dot{width:8px;height:8px}
.sync-line-t{word-break:break-all}

/* —— 底部弹窗：把手 + 居中标题 + ✕ —— */
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:200;display:none;align-items:flex-end;justify-content:center}
.mo.show{display:flex;animation:fdin .2s ease}
@keyframes fdin{from{opacity:0}to{opacity:1}}
.ml{background:var(--card);border-radius:var(--r-l) var(--r-l) 0 0;width:100%;max-height:85vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);animation:su .25s ease-out}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ml-handle{display:block;width:32px;height:4px;border-radius:var(--r-full);background:var(--line);margin:8px auto 0}
.ml-header{padding:12px 16px 0;display:flex;align-items:center;gap:8px}
.ml-title{flex:1;text-align:center;font:var(--f-h2);color:var(--ink)}
.ml-close{width:28px;height:28px;border-radius:var(--r-full);background:var(--fill);border:none;color:var(--ink2);font:var(--f-item);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ml-body{padding:16px}

/* —— 表单控件 —— */
.fg{margin-bottom:16px}
.fl{font:var(--f-cap);font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
.fi,.fs{width:100%;height:46px;padding:0 12px;border-radius:var(--r-s);border:1.5px solid transparent;background:var(--fill);font:var(--f-item);color:var(--ink);outline:none;appearance:none;-webkit-appearance:none;transition:background .2s,border-color .2s}
.fi:focus,.fs:focus{background:var(--card);border-color:var(--blue)}
.fr{display:flex;gap:12px}
.fr .fg{flex:1;min-width:0}
/* 分段胶囊（加分/扣分）：v4 保留控件（非下拉框），切换时刷新分类/项目数据源 */
.seg{display:flex;gap:8px}
.seg-b{flex:1;height:44px;border:none;border-radius:var(--r-full);background:var(--fill);color:var(--ink2);font:var(--f-body);cursor:pointer;transition:all .2s}
#segUp.on{background:var(--green-l);color:var(--grn-deep);font-weight:600}
#segDown.on{background:var(--red-l);color:var(--red-deep);font-weight:600}
/* 弹窗内确认按钮 */
.bn{display:block;width:100%;height:48px;border:none;border-radius:var(--r-m);font:var(--f-body);font-weight:700;cursor:pointer;transition:transform .15s}
.bn:active{transform:scale(.97)}
.bn:disabled{background:var(--fill);color:var(--ink2);box-shadow:none;cursor:not-allowed;transform:none}
.bn-p{background:var(--red);color:var(--card);box-shadow:var(--sh-cta)}
.bn-q{background:var(--fill);color:var(--ink);font-weight:600}
.bn-dg{background:var(--red-deep);color:var(--card)}
/* 兑换弹窗 */
.ex-now{font:var(--f-item);color:var(--ink2)}
.ex-now b{color:var(--yel-deep);font-variant-numeric:tabular-nums}
.ex-cost{font:var(--f-h2);color:var(--yel-deep);font-variant-numeric:tabular-nums;min-height:24px}

/* —— 底部 tabBar：CSS 图标 + 选中 4px 红点 —— */
.tb{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.ti{flex:1;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;user-select:none;color:var(--ink3)}
.t-ico{height:22px;display:flex;align-items:center;justify-content:center;position:relative}
.ti .tl{font:var(--f-mini);color:var(--ink2)}
.ti.on{color:var(--red)}
.ti.on .tl{color:var(--red);font-weight:600}
.ti.on .t-ico::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:var(--r-full);background:var(--red)}
.tico-brick{position:relative;width:18px;height:13px;border-radius:var(--r-s);background:currentColor;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.tico-brick::before,.tico-brick::after{content:'';position:absolute;top:2px;width:4px;height:4px;border-radius:var(--r-full);background:currentColor;box-shadow:inset 0 -1px 1px rgba(0,0,0,.25)}
.tico-brick::before{left:3px}
.tico-brick::after{right:3px}
.tico-list{display:flex;flex-direction:column;gap:4px;width:18px}
.tico-list i{display:block;height:2px;border-radius:var(--r-full);background:currentColor}
.tico-list i:nth-child(2){width:14px}
.tico-sliders{display:flex;flex-direction:column;gap:4px;width:18px}
.tico-sliders i{position:relative;display:block;height:2px;border-radius:var(--r-full);background:currentColor}
.tico-sliders i::after{content:'';position:absolute;top:-2px;width:6px;height:6px;border-radius:var(--r-full);background:currentColor}
.tico-sliders i:first-child::after{left:3px}
.tico-sliders i:last-child::after{right:3px}

/* —— 空状态：CSS 积木插画 —— */
.es{padding:40px 16px;text-align:center}
.es-bricks{position:relative;width:40px;height:36px;margin:0 auto 16px;transform:rotate(-4deg)}
.es-bricks .b{position:absolute;border-radius:var(--r-s);box-shadow:inset 0 -3px 0 rgba(0,0,0,.10)}
.es-bricks .b::before{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:var(--r-full);background:var(--card);opacity:.5}
.es-bricks .b1{width:30px;height:15px;background:var(--blue);left:6px;bottom:0}
.es-bricks .b2{width:26px;height:13px;background:var(--yellow);left:0;bottom:11px;opacity:.85}
.es-bricks .b3{width:22px;height:11px;background:var(--red);left:9px;bottom:20px;opacity:.7}
.et{font:var(--f-item);color:var(--ink2)}
.eg{font:var(--f-cap);color:var(--ink3);margin-top:4px}

/* —— toast：深底白字 + 状态色点 —— */
.to{position:fixed;top:20%;left:50%;transform:translate(-50%,-12px);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:var(--r-full);font:var(--f-item);font-weight:600;z-index:400;display:none;align-items:center;gap:8px;max-width:80%}
.to.show{display:flex;animation:fdin .2s ease}
.to-dot{display:none;width:8px;height:8px;border-radius:var(--r-full);flex-shrink:0}
.to.ok .to-dot{display:block;background:var(--green)}
.to.err .to-dot{display:block;background:var(--red)}

/* —— 确认框 —— */
.co2{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:250;display:none;align-items:center;justify-content:center}
.co2.show{display:flex;animation:fdin .2s ease}
.cb{background:var(--card);border-radius:var(--r-m);padding:20px;width:85%;max-width:300px;text-align:center}
.ct2{font:var(--f-h2);color:var(--ink)}
.cx{font:var(--f-item);color:var(--ink2);margin:8px 0 20px}
.cn{display:flex;gap:8px}
.cn .bn{flex:1;height:44px}

/* —— 日历：蓝 = 日期/筛选域 —— */
.dp{padding:16px}
.dp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding:0 4px}
.dp-month{font:var(--f-h2);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dp-nav{display:flex;gap:8px}
.dp-navbtn{width:36px;height:36px;border-radius:var(--r-full);background:var(--fill);border:none;font:var(--f-h2);cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
.dp-navbtn:active{background:var(--blue-l);color:var(--blue-deep)}
.dp-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dp-weekday{font:var(--f-cap);color:var(--ink2);text-align:center;padding:4px 0}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dp-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font:var(--f-item);font-variant-numeric:tabular-nums;cursor:pointer;border-radius:var(--r-full);transition:background .15s}
.dp-day:active{background:var(--blue-l)}
.dp-day.other{color:var(--ink3)}
.dp-day.today{color:var(--blue-deep);font-weight:700}
.dp-day.selected{background:var(--blue);color:var(--card)}
.dp-day.inrange{background:var(--blue-l);color:var(--blue-deep)}

/* —— 登录页 —— */
.login-page{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}

.fbrick{position:absolute;width:32px;height:22px;border-radius:var(--r-s);opacity:.5;box-shadow:inset 0 -3px 0 rgba(0,0,0,.10);display:flex;justify-content:space-evenly;padding-top:3px}
.fbrick i{width:6px;height:6px;border-radius:var(--r-full);box-shadow:inset 0 -1px 1px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.35)}
.fbrick.red{top:10%;left:8%;background:var(--red);transform:rotate(-12deg)}
.fbrick.red i{background:var(--red)}
.fbrick.blu{bottom:12%;right:10%;background:var(--blue);transform:rotate(10deg)}

.login-logo{width:72px;height:52px;border-radius:var(--r-s);background:var(--red);box-shadow:inset 0 -3px 0 rgba(0,0,0,.10);display:grid;grid-template-columns:repeat(3,10px);grid-template-rows:repeat(2,10px);justify-content:space-between;align-content:space-between;padding:8px 16px;margin-bottom:16px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.login-title{font:var(--f-display);color:var(--ink);margin-bottom:4px}
.login-sub{font:var(--f-item);color:var(--ink2);margin-bottom:32px}
.login-card{background:var(--card);border:var(--bd);border-radius:var(--r-l);box-shadow:var(--sh-card);padding:20px;width:100%;max-width:340px}

.login-quick{display:flex;flex-direction:column;gap:8px}

/* —— 用户切换弹窗（底部弹窗规范）—— */

<script>
var SK='***';
var USER_KEY='star_users';
var CURR_KEY='star_current';
/* ===== 云端同步配置 =====
   数据仓库（私有）：wxx-1006/star-points-data，数据文件 sync-data.json。
   token 运行时输入：用户在设置页填入 Fine-grained token，仅存本机 localStorage，
   严禁硬编码。无 token 时同步静默跳过（色点灰），本地功能不受影响。 */
var GH_REPO='wxx-1006/star-points-data';
var GH_FILE='sync-data.json';
var GH_API='https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE;
var TOKEN_KEY='sp_gh_token';
var syncSHA='';
var currentUser=null;
var syncStatus='off'; // off(未配置/灰) | loading(黄) | synced(绿) | error(红)
var syncErr='';       // 最近一次同步失败提示，显示在设置页「云端同步」状态行
function getSyncToken(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(e){return ''}}
function getUsers(){try{var r=localStorage.getItem(USER_KEY);if(r)return JSON.parse(r)}catch(e){}return[]}
function saveUsers(u){try{localStorage.setItem(USER_KEY,JSON.stringify(u))}catch(e){}}
function getCurrentPhone(){try{return localStorage.getItem(CURR_KEY)||null}catch(e){}return null}
function setCurrentPhone(p){try{localStorage.setItem(CURR_KEY,p)}catch(e){}}
function userKey(phone){return SK+'_'+phone}
function ld(){var phone=currentUser;if(!phone)return gd();try{var r=localStorage.getItem(userKey(phone));if(r)return JSON.parse(r)}catch(e){}return gd()}
function sd(d){var phone=currentUser;if(!phone)return;try{localStorage.setItem(userKey(phone),JSON.stringify(d))}catch(e){};syncPush(d)}
function migrateOldData(phone){try{var old=localStorage.getItem(SK);if(old&&phone){var parsed=JSON.parse(old);if(parsed.records&&parsed.records.length>0){localStorage.setItem(userKey(phone),JSON.stringify(parsed));toast('已迁移历史数据')}}}catch(e){}}

// ===== 数据同步 (GitHub Contents API，私有仓库 star-points-data) =====
// 状态机（用户胶囊 6px 色点 + 设置页状态行）：
//   off    灰 = 未配置 token，同步静默跳过，本地照常
//   loading 黄 = 同步请求进行中
//   empty  灰 = 已配置，但云端暂无数据文件（新仓库首次使用，正常态），本地照常
//   synced  绿 = 最近一次同步成功
//   error   红 = token 无效(401)/无权限 或 网络失败；本地数据不受影响
// 冲突策略：last-write-wins（后保存整体覆盖），家庭场景够用。
function utf8ToB64(str){return btoa(unescape(encodeURIComponent(str)))}
function b64ToUtf8(b64){return decodeURIComponent(escape(atob(b64)))}
function syncPull(phone){
  var token=getSyncToken();
  if(!token){ // 未配置：跳过，不报错
    syncStatus='off';syncErr='';
    updateSyncUI();
    return Promise.resolve(ld());
  }
  syncStatus='loading';syncErr='';
  updateSyncUI();
  return fetch(GH_API,{headers:{'Authorization':'token '+token}})
    .then(function(r){
      if(r.status===401){ // token 无效
        syncStatus='error';syncErr='token 无效或无权限，请到设置页重新填写';
        updateSyncUI();
        return ld();
      }
      if(r.status===404){ // 云端数据文件尚未创建（新仓库首次使用，正常态）：不报错，本地照常
        syncStatus='empty';syncErr='';
        updateSyncUI();
        return ld();
      }
      if(!r.ok){
        syncStatus='error';syncErr='同步失败（HTTP '+r.status+'）';
        updateSyncUI();
        return ld();
      }
      return r.json().then(function(meta){
        syncSHA=meta.sha||'';
        if(meta.content){
          try{
            var content=b64ToUtf8(meta.content);
            var allData=JSON.parse(content);
            if(allData && allData[phone]){
              localStorage.setItem(userKey(phone),JSON.stringify(allData[phone]));
            }
          }catch(e){}
        }
        syncStatus='synced';syncErr='';
        updateSyncUI();
        return ld();
      });
    })
    .catch(function(){
      // 网络失败：本地数据不受影响
      syncStatus='error';syncErr='网络异常，同步失败，本地数据不受影响';
      updateSyncUI();
      return ld();
    });
}
function syncPush(data){
  if(!currentUser)return;
  var token=getSyncToken();
  if(!token){ // 未配置：跳过，不报错
    syncStatus='off';syncErr='';
    updateSyncUI();
    return;
  }
  syncStatus='loading';
  updateSyncUI();
  fetch(GH_API,{headers:{'Authorization':'token '+token}})
    .then(function(r){
      // 404 = 云端文件尚未创建（首次推送即迁移），按空数据处理走创建流程
      if(r.status===404){syncSHA='';return {sha:'',content:null}}
      // 其他非 ok（401/403/5xx/429 等）：语义不明时不推送，避免误创建覆盖
      if(!r.ok){
        syncStatus='error';
        syncErr=(r.status===401||r.status===403)?'token 无效或无权限，请到设置页重新填写':'同步失败（HTTP '+r.status+'），本地数据不受影响';
        updateSyncUI();
        return null;
      }
      return r.json();
    })
    .then(function(meta){
      if(!meta)return;
      syncSHA=meta.sha||'';
      var allData={};
      if(meta.content){
        try{allData=JSON.parse(b64ToUtf8(meta.content))}catch(e){}
      }
      allData[currentUser]=data;
      var content=utf8ToB64(JSON.stringify(allData));
      return fetch(GH_API,{method:'PUT',headers:{'Authorization':'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'sync:'+currentUser,content:content,sha:syncSHA})})
        .then(function(r){
          if(r.status===401){
            syncStatus='error';syncErr='token 无效或无权限，请到设置页重新填写';
          }else if(r.status===403||r.status===404){
            // 推送被拒：多半是 token 未勾选该仓库或 Contents 权限不足，给出具体排查指引
            syncStatus='error';syncErr='token 权限不足：请检查是否勾选了 star-points-data 仓库且 Contents 为 Read and write';
          }else if(r.ok){
            syncStatus='synced';syncErr='';
          }else{
            syncStatus='error';syncErr='同步失败（HTTP '+r.status+'），本地数据不受影响';
          }
          updateSyncUI();
        });
    })
    .catch(function(){
      syncStatus='error';syncErr='网络异常，同步失败，本地数据不受影响';
      updateSyncUI();
    });
}
// 同步状态合并进用户胶囊：6px 色点（绿=已同步，黄=同步中，红=失败，灰=未配置）
function updateSyncUI(){
  var el=document.getElementById('syncStatus');
  if(!el)return;
  var c='sync-dot';
  if(syncStatus==='loading')c+=' wait';
  else if(syncStatus==='synced')c+=' ok';
  else if(syncStatus==='error')c+=' err';
  else c+=' off';
  el.className=c;
  renderSyncSettings();
}
// ===== 设置页「云端同步」区块 =====
function renderSyncSettings(){
  var line=document.getElementById('syncStateLine');
  if(!line)return;
  var inp=document.getElementById('syncTokenInput');
  var token=getSyncToken();
  // 回填已保存 token（密码框掩码显示）；输入框聚焦时不回填，避免打断输入
  if(inp && document.activeElement!==inp){
    var cur=inp.value.trim();
    if(cur!==token) inp.value=token;
  }
  var dot='off',txt='';
  if(!token){
    dot='off';txt='未配置：填入 token 后即可多设备同步';
  }else if(syncStatus==='loading'){
    dot='wait';txt='已配置 · 同步中…';
  }else if(syncStatus==='synced'){
    dot='ok';txt='已配置 · 最近同步成功';
  }else if(syncStatus==='empty'){
    dot='off';txt='已配置 · 云端暂无数据，首次记分后自动创建';
  }else if(syncStatus==='error'){
    dot='err';txt=syncErr||'同步失败';
  }else{
    dot='ok';txt='已配置';
  }
  line.innerHTML='<span class="sync-dot '+dot+'"></span><span class="sync-line-t">'+txt+'</span>';
}
// 保存 token：写入 localStorage 并立即触发一次 syncPull 验证
function saveSyncToken(){
  var inp=document.getElementById('syncTokenInput');
  var v=inp.value.trim();
  if(!v){toast('请输入 GitHub token','err');return}
  try{localStorage.setItem(TOKEN_KEY,v)}catch(e){toast('保存失败','err');return}
  toast('已保存，正在验证同步…','ok');
  if(currentUser){
    syncPull(currentUser).then(function(data){ad=data;render()});
  }else{
    syncStatus='off';syncErr='';updateSyncUI();
  }
}
function doSync(){
  if(!currentUser)return;
  syncPull(currentUser).then(function(data){
    ad=data;
    render();
  });
}

function doLogin(){
  var phone=document.getElementById('loginPhone').value.trim();
  var name=document.getElementById('loginName').value.trim();
  if(!phone||phone.length<11){toast('请输入正确的手机号','err');return}
  if(!name){toast('请输入姓名','err');return}
  var users=getUsers();
  var exist=users.find(function(u){return u.phone===phone});
  if(!exist){
    if(users.length>=3){toast('最多支持3个账号','err');return}
    users.push({phone:phone,name:name});
    saveUsers(users);
  }
  setCurrentPhone(phone);
  currentUser=phone;
  migrateOldData(phone);
  enterApp();
}

  currentUser=phone;

  document.getElementById('loginPage').classList.remove('show');
  document.getElementById('mainHeader').style.display='';
  document.getElementById('userSwitch').style.display='';
  var users=getUsers();

    ad=data;
    renderAll(ad);
  });
}

function renderHome(){

  var tr=ad.records.filter(function(r){return r.date===today()});

  var td2=tr.filter(function(r){return r.score<0}).reduce(function(s,r){return s+Math.abs(r.score)},0);
  var tn=tu-td2;
  document.getElementById('tu').textContent='+'+tu;
  document.getElementById('td').textContent='-'+td2;
  var tpe=document.getElementById('tdp');
  if(tn>0) tpe.innerHTML='今日：<span class="up">+'+tn+'</span>';
  else if(tn<0) tpe.innerHTML='今日：<span class="down">'+tn+'</span>';
  else tpe.textContent='今日：0';

  var sk=0;var dc=new Date();
  while(true){
    var ds=dc.getFullYear()+'-'+String(dc.getMonth()+1).padStart(2,'0')+'-'+String(dc.getDate()).padStart(2,'0');
    if(ad.records.some(function(r){return r.date===ds})){sk++;dc.setDate(dc.getDate()-1)}

  }
  document.getElementById('ts').textContent=sk;

  var wb=document.getElementById('wb');wb.innerHTML='';
  var dl=['日','一','二','三','四','五','六'];
  // 近一周概览：滚动 7 天窗口（今天-6 ~ 今天），按时间正序排列，最右为今天
  var ws=new Date();ws.setDate(ws.getDate()-6);
  for(var i=0;i<7;i++){
    var dd2=new Date(ws);dd2.setDate(ws.getDate()+i);
    var ds2=dd2.getFullYear()+'-'+String(dd2.getMonth()+1).padStart(2,'0')+'-'+String(dd2.getDate()).padStart(2,'0');
    var dr2=ad.records.filter(function(r){return r.date===ds2});
    var upN=dr2.filter(function(r){return r.score>0}).reduce(function(s,r){return s+r.score},0);
    var dnN=dr2.filter(function(r){return r.score<0}).reduce(function(s,r){return s+Math.abs(r.score)},0);
    var dn=upN-dnN;
    // 底部色条：加分绿 / 扣分红 / 混合日黄
    var bar='';
    if(upN>0&&dnN>0)bar='var(--yellow)';
    else if(dn>0)bar='var(--green)';
    else if(dn<0)bar='var(--red)';
    // 净分数字：正分绿 / 负分红 / 0（含无记录日）次级灰，成为格子视觉主体
    var sTxt='0',sClr='var(--ink2)';
    if(dn>0){sTxt='+'+dn;sClr='var(--grn-deep)'}
    else if(dn<0){sTxt=String(dn);sClr='var(--red-deep)'}
    var d=document.createElement('div');
    var vd2=selectedDay||today(); // 视图日：红框跟随选中格，未选中时停在今天
    var lbl=(ds2===today())?'今天':dl[dd2.getDay()];
    d.className='sbd'+(vd2===ds2?' tdy':'');
    d.innerHTML='<span class="sdl">'+lbl+'</span><span class="sdd">'+dd2.getDate()+'</span><span class="sds" style="color:'+sClr+'">'+sTxt+'</span>'+(bar?'<i class="sdbar" style="background:'+bar+'"></i>':'');
    d.onclick=(function(ds){return function(){openDayDetail(ds)}})(ds2);
    wb.appendChild(d);
  }

  // 当日记录列表：视图日 = selectedDay || 今天，点击周概览某格即就地切换到那天的记录
  var vd=selectedDay||today();
  var vrecs=ad.records.filter(function(r){return r.date===vd});
  var vexs=ad.exchanges.filter(function(e){return e.date===vd});
  var vitems=[];
  for(var i=0;i<vrecs.length;i++) vitems.push({type:'record',data:vrecs[i]});
  for(var i=0;i<vexs.length;i++) vitems.push({type:'exchange',data:vexs[i]});
  vitems.sort(cmpTimeDesc);

  document.getElementById('trTitle').textContent=dayTitle(vd);
  document.getElementById('backToday').style.display=(vd!==today())?'':'none';

  var trl=document.getElementById('tr');
  if(vitems.length===0){
    trl.innerHTML=(vd===today())
      ?'<div class="es">'+esBricks()+'<div class="et">今天还没有记录哦</div><div class="eg">点击上方按钮开始加分吧！</div></div>'
      :'<div class="es">'+esBricks()+'<div class="et">该日暂无记录</div></div>';
  }else{
    var html2='';
    for(var i=0;i<vitems.length;i++){
      if(vitems[i].type==='record') html2+=renderRecord(vitems[i].data,vd);
      else html2+=renderExchange(vitems[i].data,vd);

// 当日记录区块标题：视图日为今天 →「今日记录」；其他日子 →「当日记录 · X月X日 周X」
function dayTitle(ds){
  if(ds===today())return'今日记录';
  var p=ds.split('-');
  var d=new Date(ds);
  var w=['周日','周一','周二','周三','周四','周五','周六'];
  return '当日记录 · '+parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日 '+w[d.getDay()];
}

// 记录列表通用排序：按发生日期(data.date)降序，同日期内按录入时间(timestamp)降序。
// 补签记录的 timestamp 是录入时刻而非发生日期，故必须先比 date 才符合用户视角的时间倒序；
// timestamp 缺失（旧版迁移数据）按 0 处理，避免 NaN 导致排序错乱。
function cmpTimeDesc(a,b){
  if(a.data.date!==b.data.date) return a.data.date<b.data.date?1:-1;
  return (b.data.timestamp||0)-(a.data.timestamp||0);
}

function renderRecord(r,currentDay){
  var u=r.score>0;
  var cls=u?'u':'d';
  var sign=u?'+':'';
  var noteStr=r.note?(' · '+r.note):'';
  var timeStr=(r.date===currentDay)?fdt(r.timestamp):fd(r.date)+' '+fdt(r.timestamp);
  return '<div class="ri"><span class="cat-dot" style="background:'+catColor(r.category)+'"></span><div class="inf"><div class="nm">'+r.name+'</div><div class="tm">'+timeStr+noteStr+'</div></div><div class="sc2 '+cls+'">'+sign+r.score+'</div><button class="dl" onclick="deleteRecord(\''+r.id+'\')">✕</button></div>';
}

function renderExchange(e,currentDay){
  var timeStr=(e.date===currentDay)?fdt(e.timestamp):fd(e.date)+' '+fdt(e.timestamp);
  return '<div class="ri"><span class="cat-dot" style="background:var(--yellow)"></span><div class="inf"><div class="nm">'+e.name+'</div><div class="tm">'+timeStr+'</div></div><span class="ex-chip">兑换</span><div class="sc2 e">-'+e.cost+'</div></div>';
}

function renderRecords(){
  if(!dateRangeStart) dateRangeStart=today();
  if(!dateRangeEnd) dateRangeEnd=today();
  document.getElementById('dateTriggerText').textContent=dateRangeStart.replace(/-/g,'/')+' 至 '+dateRangeEnd.replace(/-/g,'/');

  // 类型筛选按钮
  var types=['所有','得分','扣分','兑换'];
  var typeHtml='';
  for(var i=0;i<types.length;i++){
    typeHtml+='<div class="ftb'+(curTypeFilter===types[i]?' on':'')+'" onclick="setTypeFilter(\''+types[i]+'\')">'+types[i]+'</div>';
  }
  document.getElementById('typeFilter').innerHTML=typeHtml;

  var allItems=[];
  for(var i=0;i<ad.records.length;i++){
    allItems.push({type:'record',data:ad.records[i]});
  }
  for(var i=0;i<ad.exchanges.length;i++){
    allItems.push({type:'exchange',data:ad.exchanges[i]});
  }

  if(curTypeFilter==='得分') allItems=allItems.filter(function(item){return item.type==='record'&&item.data.score>0});
  else if(curTypeFilter==='扣分') allItems=allItems.filter(function(item){return item.type==='record'&&item.data.score<0});
  else if(curTypeFilter==='兑换') allItems=allItems.filter(function(item){return item.type==='exchange'});

  if(dateRangeStart) allItems=allItems.filter(function(item){return item.data.date>=dateRangeStart});
  if(dateRangeEnd) allItems=allItems.filter(function(item){return item.data.date<=dateRangeEnd});

  allItems.sort(cmpTimeDesc);

  var ar=document.getElementById('ar');
  if(allItems.length===0) ar.innerHTML='<div class="es">'+esBricks()+'<div class="et">这个时间段还没有记录</div></div>';
  else{
    var html='';
    for(var i=0;i<allItems.length;i++){
      if(allItems[i].type==='record') html+=renderRecord(allItems[i].data,today());
      else html+=renderExchange(allItems[i].data,today());
    }
    ar.innerHTML=html;
  }
}

// 设置页行列表：照 v3——按分类再分组，每个分类小节可展开/收缩
// 状态存内存 sectionState[stateKey+'_'+cat]（刷新重置，不用 localStorage）
function renderGroupedItems(items,type,stateKey){
  var groups={};
  var order=[];
  for(var i=0;i<items.length;i++){
    var c=items[i].category;
    if(!groups[c]){groups[c]=[];order.push(c)}
    groups[c].push(items[i]);
  }
  var html='';
  for(var j=0;j<order.length;j++){
    var cat=order[j];
    var isOpen=sectionState[stateKey+'_'+cat]===true;
    html+='<div class="sg sg-sub">';
    html+='<div class="sgh'+(isOpen?' open':'')+'" onclick="toggleSection(this,\''+stateKey+'_'+cat+'\')">';
    html+='<div class="sgt"><span class="cat-dot" style="background:'+catColor(cat)+'" aria-hidden="true"></span>'+cat+'<span class="cnt">('+groups[cat].length+'项)</span></div>';
    html+='<span class="arr" aria-hidden="true"></span>';
    html+='</div>';
    html+='<div class="sgc'+(isOpen?' open':'')+'">';
    for(var k=0;k<groups[cat].length;k++){
      var it=groups[cat][k];
      var sign=type==='up'?'+':'-';
      html+='<div class="sr"><span class="n">'+it.name+'</span><span class="s '+(type==='up'?'u':'d')+'">'+sign+it.score+'</span><button class="ed" onclick="editItem(\''+type+'\',\''+it.id+'\')">✎</button><button class="x" onclick="deleteItem(\''+type+'\',\''+it.id+'\')">✕</button></div>';
    }
    html+='</div></div>';
  }
  return html;
}

// 折叠切换（照 v3）：切头与内容的 open 类，状态记入内存 sectionState
function toggleSection(header,stateKey){
  var content=header.nextElementSibling;
  header.classList.toggle('open');
  content.classList.toggle('open');
  if(stateKey){
    sectionState[stateKey]=header.classList.contains('open');
  }
}

// 补签最早可选日期：今天往前 6 天（含今天共 7 天）
function minRecordDate(){
  var d=new Date();
  d.setDate(d.getDate()-6);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function populateCats(){
  var items=scoreType==='up'?ad.upItems:ad.downItems;
  var cats=[];var catSet={};
  for(var i=0;i<items.length;i++){
    if(!catSet[items[i].category]){catSet[items[i].category]=true;cats.push(items[i].category)}
  }
  var catHtml='';
  for(var i=0;i<cats.length;i++){
    catHtml+='<option value="'+cats[i]+'">'+cats[i]+'</option>';
  }
  document.getElementById('scat').innerHTML=catHtml;
  if(cats.length>0) selectCat(cats[0]);
  else{document.getElementById('scat').innerHTML='';document.getElementById('sis').innerHTML=''}
}

function selectCat(cat){
  document.getElementById('scat').value=cat;
  var items=scoreType==='up'?ad.upItems:ad.downItems;
  var html='';
  for(var i=0;i<items.length;i++){
    if(items[i].category===cat){
      var unitStr=(items[i].unit)?('/'+items[i].unit):'';
      html+='<option value="'+items[i].id+'" data-score="'+items[i].score+'">'+items[i].name+' ('+items[i].score+'分'+unitStr+')</option>';
    }
  }
  document.getElementById('sis').innerHTML=html;
  if(html){
    for(var i=0;i<items.length;i++){
      if(items[i].category===cat){document.getElementById('sv').value=items[i].score;break}
    }
  }
}

document.addEventListener('change',function(e){
  if(e.target.id==='sis'){
    var o=e.target.options[e.target.selectedIndex];
    if(o) document.getElementById('sv').value=o.dataset.score||5;
  }
});

function ss(){
  var sis=document.getElementById('sis');
  var items=scoreType==='up'?ad.upItems:ad.downItems;
  var it=null;
  for(var i=0;i<items.length;i++){if(items[i].id===sis.value){it=items[i];break}}
  if(!it){toast('请选择项目','err');return}
  var sv=parseInt(document.getElementById('sv').value)||0;
  var sn=document.getElementById('sn').value.trim();
  if(sv<=0){toast('分值必须大于0','err');return}
  var dateInput=document.getElementById('sdate');
  var recDate=dateInput.value||today();
  if(recDate>today()){toast('日期不能晚于今天','err');return}
  if(recDate<minRecordDate()){toast('只能补录最近7天内的记录','err');return}
  var rec={id:'r_'+Date.now(),date:recDate,timestamp:Date.now(),type:scoreType,itemId:it.id,name:it.name,category:it.category,score:scoreType==='up'?sv:-sv,note:sn};
  ad.records.push(rec);
  ad.totalPoints+=rec.score;
  sd(ad);
  document.getElementById('ms').classList.remove('show');
  toast(scoreType==='up'?('+'+sv+' 分'):('-'+sv+' 分'),scoreType==='up'?'ok':'err');
  render();
}

function openExchange(){
  document.getElementById('exScore').textContent=ad.totalPoints;
  var html='';
  for(var i=0;i<ad.shopItems.length;i++){
    var it=ad.shopItems[i];
    var ca=ad.totalPoints>=it.cost;
    html+='<option value="'+it.id+'" data-cost="'+it.cost+'" '+(ca?'': 'disabled')+'>'+it.name+' (-'+it.cost+'分)</option>';
  }
  if(!html) html='<option value="">没有可兑换项</option>';
  document.getElementById('exSelect').innerHTML=html;
  var exBtn=document.getElementById('exConfirm');
  var anyFit=ad.shopItems.some(function(it){return ad.totalPoints>=it.cost});
  if(anyFit){
    exBtn.disabled=false;
    // 初始显式选中第一个可用项（disabled 首项会导致 selectedIndex=-1，cost 无法填充）
    var selEl=document.getElementById('exSelect');
    for(var j=0;j<selEl.options.length;j++){
      if(!selEl.options[j].disabled){selEl.selectedIndex=j;break}
    }
    onExSelectChange();
  }else{
    // 积分不足：按钮置 disabled（禁用视觉 .bn:disabled）；confirmExchange 内的 guard 保留兜底
    exBtn.disabled=true;
    document.getElementById('exCost').textContent='积分不足，暂无可兑换项';
  }
  document.getElementById('ms2').classList.add('show');
}

function onExSelectChange(){
  var sel=document.getElementById('exSelect');
  var opt=sel.options[sel.selectedIndex];
  if(opt&&opt.dataset.cost) document.getElementById('exCost').textContent=opt.dataset.cost+' 分';
  else document.getElementById('exCost').textContent='';
}

function confirmExchange(){
  var sel=document.getElementById('exSelect');
  var itemId=sel.value;
  if(!itemId){toast('请选择兑换项','err');return}
  var it=null;
  for(var i=0;i<ad.shopItems.length;i++){if(ad.shopItems[i].id===itemId){it=ad.shopItems[i];break}}
  if(!it||ad.totalPoints<it.cost){toast('积分不足','err');return}
  sc2('确认兑换','用 '+it.cost+' 积分兑换「'+it.name+'」？',function(){
    ad.totalPoints-=it.cost;
    ad.exchanges.push({id:'ex_'+Date.now(),date:today(),timestamp:Date.now(),shopItemId:itemId,name:it.name,icon:it.icon,cost:it.cost});
    sd(ad);
    toast('兑换成功，剩余 '+ad.totalPoints+' 分','ok');
    document.getElementById('ms2').classList.remove('show');
    render();
  });
}

function deleteRecord(id){
  var r=null;
  for(var i=0;i<ad.records.length;i++){if(ad.records[i].id===id){r=ad.records[i];break}}
  if(!r)return;
  var sign=r.score>0?'+':'';
  var action=r.score>0?'减少':'增加';
  sc2('删除记录','删除「'+r.name+'」('+sign+r.score+'分)？总分将'+action+Math.abs(r.score)+'分。',function(){
    ad.totalPoints-=r.score;
    ad.records=ad.records.filter(function(x){return x.id!==id});
    sd(ad);
    toast('已删除');
    render();
  });
}

}

  document.getElementById('asc').value=it.score;

function sai(){
  var n=document.getElementById('an').value.trim();
  var scv=parseInt(document.getElementById('asc').value)||0;
  var cat=document.getElementById('acat').value;
  if(!n){toast('请输入名称','err');return}
  if(scv<=0){toast('分值必须大于0','err');return}
  var editId=document.getElementById('editId').value;
  if(editId){
    // 编辑模式
    var items=ad.upItems.concat(ad.downItems);
    for(var i=0;i<items.length;i++){
      if(items[i].id===editId){
        items[i].name=n;items[i].score=scv;items[i].category=cat;break;
      }
    }
  }else{
    var isUp=document.getElementById('amt').textContent.indexOf('加分')>=0;
    var t=isUp?ad.upItems:ad.downItems;
    t.push({id:(isUp?'up_':'down_')+Date.now(),name:n,score:scv,category:cat});
  }
  sd(ad);
  document.getElementById('ma').classList.remove('show');
  toast('保存成功','ok');
  render();
}

// Date picker functions
function openDatePicker(){
  dpMonth=new Date();
  dpSelectedStart=null;
  dpSelectedEnd=null;
  renderCalendars();
  document.getElementById('datePicker').classList.add('show');
}

function closeDatePicker(){
  document.getElementById('datePicker').classList.remove('show');
}

function renderCalendars(){
  document.getElementById('singleCalendar').innerHTML=renderMonthCalendar(dpMonth);
}

function renderMonthCalendar(month){
  var year=month.getFullYear();
  var m=month.getMonth();
  var months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var weekDays=['日','一','二','三','四','五','六'];
  var firstDay=new Date(year,m,1);
  var startDay=firstDay.getDay();
  var daysInMonth=new Date(year,m+1,0).getDate();
  var daysInPrevMonth=new Date(year,m,0).getDate();
  var todayStr=today();
  var html='<div class="dp-header"><div class="dp-month">'+year+'年 '+months[m]+'</div><div class="dp-nav">';
  html+='<button class="dp-navbtn" onclick="prevMonth()">‹</button>';
  html+='<button class="dp-navbtn" onclick="nextMonth()">›</button>';
  html+='</div></div>';
  html+='<div class="dp-week">';
  for(var i=0;i<7;i++) html+='<div class="dp-weekday">'+weekDays[i]+'</div>';
  html+='</div>';
  html+='<div class="dp-days">';
  var totalCells=Math.ceil((startDay+daysInMonth)/7)*7;
  for(var i=0;i<totalCells;i++){
    var dayNum=i-startDay+1;
    var cellMonth=m;
    var cellYear=year;
    if(dayNum<=0){cellMonth=m-1;if(cellMonth<0){cellMonth=11;cellYear++}dayNum=daysInPrevMonth+dayNum}
    else if(dayNum>daysInMonth){cellMonth=m+1;if(cellMonth>11){cellMonth=0;cellYear++}dayNum=dayNum-daysInMonth}
    var dateStr=cellYear+'-'+String(cellMonth+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');
    var classes='dp-day';
    if(cellMonth!==m) classes+=' other';
    if(dateStr===todayStr) classes+=' today';
    if(dpSelectedStart&&dateStr===dpSelectedStart) classes+=' selected';
    if(dpSelectedEnd&&dateStr===dpSelectedEnd) classes+=' selected';
    if(dpSelectedStart&&dpSelectedEnd&&dateStr>dpSelectedStart&&dateStr<dpSelectedEnd) classes+=' inrange';
    else if(dpSelectedStart&&!dpSelectedEnd&&dateStr>dpSelectedStart) classes+=' inrange';
    html+='<div class="'+classes+'" onclick="selectDate(\''+dateStr+'\')">'+dayNum+'</div>';
  }
  html+='</div>';
  return html;
}

function prevMonth(){dpMonth.setMonth(dpMonth.getMonth()-1);renderCalendars()}
function nextMonth(){dpMonth.setMonth(dpMonth.getMonth()+1);renderCalendars()}

function selectDate(dateStr){
  if(!dpSelectedStart||(dpSelectedStart&&dpSelectedEnd)){
    dpSelectedStart=dateStr;
    dpSelectedEnd=null;
  }else{
    if(dateStr<dpSelectedStart){dpSelectedEnd=dpSelectedStart;dpSelectedStart=dateStr}
    else{dpSelectedEnd=dateStr}
    dateRangeStart=dpSelectedStart;
    dateRangeEnd=dpSelectedEnd;
    closeDatePicker();
    renderRecords();
    return;
  }
  renderCalendars();
}
