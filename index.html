<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAF1DF">
<title>🧱 乐高积分</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
<style>
/* ===== v3：奶油底 + 马卡龙积木色设计系统 =====
   规则：所有颜色一律走 :root token；gradient 只允许 token 组合；
   功能域固定积木色：加分=绿 / 扣分&主操作=红 / 兑换&连续=黄 / 记录筛选&日期=蓝 */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* —— 中性底色 —— */
  --cream:#FAF1DF;          /* 页面奶油底 */
  --cream-hi:#FDF8EC;       /* 奶油高光（渐变起点） */
  --card:#FFFFFF;           /* 卡片纯白 */
  --tx:#3D3A34;             /* 主文字：深暖灰 */
  --tx2:#8A8478;            /* 次文字 */
  --bd:#EFE6D6;             /* 描边/分隔线（暖） */
  --gray-l:#F0EBE0;         /* 灰色系底（编辑/删除/取消） */
  --overlay:rgba(61,58,52,.45);
  /* —— 四大积木色（马卡龙化） —— */
  --red:#E45A50;            /* 品牌/主按钮/选中态 */
  --yellow:#F5B840;         /* 兑换/连续天数 */
  --blue:#5B9BD5;           /* 记录筛选/日期选择 */
  --green:#6BBF8A;          /* 加分 */
  /* —— 积木色深色变体（文字/按钮） —— */
  --red-deep:#C94B42;
  --yellow-deep:#8A5F0A;
  --blue-deep:#3E7CAD;
  --green-deep:#3D8B5F;
  /* —— 积木色浅底衍生（色块底衬） —— */
  --red-l:#FDEAE8;
  --yellow-l:#FCF1D8;
  --blue-l:#E8F1FA;
  --green-l:#E9F5EE;
  --red-l2:#F7D4D0;
  --yellow-l2:#F5E2B4;
  --blue-l2:#D3E5F5;
  --green-l2:#D5EBDF;
  /* —— 凸点高光/暗边（砖块画法用） —— */
  --red-hi:#F4968E;  --red-lo:#C94840;
  --yellow-hi:#FFE18C; --yellow-lo:#DDA123;
  --blue-hi:#8FC0E8; --blue-lo:#4784B8;
  --green-hi:#94D6AE; --green-lo:#54A871;
  /* —— 圆角 —— */
  --r-card:16px; --r-btn:12px; --r-sm:10px;
  /* —— 阴影（统一 soft） —— */
  --sh:0 2px 8px rgba(61,58,52,.06),0 8px 24px rgba(61,58,52,.08);
  --sh-sm:0 1px 3px rgba(61,58,52,.06);
  --sh-red:0 3px 10px rgba(228,90,80,.25);
  --sh-yellow:0 3px 10px rgba(245,184,64,.35);
  /* —— v2 token 别名（遗留内联样式/JS 字符串引用，统一映射到新体系） —— */
  --p:var(--red); --pd:var(--red-deep); --s:var(--blue); --a:var(--yellow);
  --ok:var(--green-deep); --no:var(--red-deep); --bg:var(--cream); --tl:var(--tx2);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--cream);color:var(--tx);min-height:100vh;padding-bottom:70px;-webkit-tap-highlight-color:transparent}
/* —— 顶栏：奶油底延续，品牌靠标题 + 左侧小红砖 logo —— */
.header{background:linear-gradient(180deg,var(--cream-hi),var(--cream));color:var(--tx);padding:16px 16px 14px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--bd)}
.header h1{font-size:18px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.header .sub{text-align:center;font-size:11px;color:var(--tx2);margin-top:3px}
.logo-brick{display:inline-block;width:24px;height:17px;border-radius:4px;background-color:var(--red);background-image:radial-gradient(circle at 32% 24%,rgba(255,255,255,.55) 0 2.4px,transparent 3px),radial-gradient(circle at 68% 24%,rgba(255,255,255,.55) 0 2.4px,transparent 3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.25),var(--sh-red)}
/* —— 顶栏用户/同步按钮：奶油底上的白胶囊 —— */
.user-switch{position:absolute;top:12px;right:14px;background:var(--card);border:1.5px solid var(--bd);border-radius:20px;padding:5px 12px;color:var(--tx);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;box-shadow:var(--sh-sm);transition:all .2s;z-index:50}
#syncBtn{left:14px;right:auto;z-index:60}
.user-switch:active{transform:scale(.95);background:var(--cream)}
.user-switch .us-avatar{width:20px;height:20px;border-radius:50%;background:var(--red-l);color:var(--red-deep);display:flex;align-items:center;justify-content:center;font-size:10px}
/* —— 总积分卡：白卡为主 + 右上角黄红双色积木角标 —— */
.pc{background:var(--card);margin:12px 14px 14px;border-radius:var(--r-card);padding:20px 16px 18px;text-align:center;box-shadow:var(--sh);position:relative;z-index:10}
.pc .lb{font-size:12px;color:var(--tx2);font-weight:600;letter-spacing:1px}
.pc .pts{font-size:48px;font-weight:800;line-height:1.15;color:var(--tx);margin-top:2px}
.pc .td{font-size:12px;margin-top:4px;color:var(--tx2)}
.pc .td .up{color:var(--green-deep);font-weight:700}
.pc .td .down{color:var(--red-deep);font-weight:700}
.pc-brick{position:absolute;top:18px;right:16px;display:grid;grid-template-columns:repeat(4,11px);gap:3px;padding:5px;border-radius:6px;background:linear-gradient(90deg,var(--yellow) 0 50%,var(--red) 50% 100%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14),var(--sh)}
.pc-brick i{display:block;width:11px;height:11px;border-radius:50%;box-shadow:inset 0 -1.5px 1.5px rgba(0,0,0,.22),inset 0 1.5px 1.5px rgba(255,255,255,.45)}
.pc-brick i:nth-child(-n+4){background:radial-gradient(circle at 35% 28%,var(--yellow-hi) 0%,var(--yellow) 58%,var(--yellow-lo) 100%)}
.pc-brick i:nth-child(n+5){background:radial-gradient(circle at 35% 28%,var(--red-hi) 0%,var(--red) 58%,var(--red-lo) 100%)}
/* —— 三宫格统计：浅底色块 + 深色数字（绿/红/黄） —— */
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 14px;margin-bottom:16px}
.sc{background:var(--card);border-radius:var(--r-card);padding:12px 6px;text-align:center;box-shadow:var(--sh)}
.sc .si{font-size:18px;width:34px;height:34px;margin:0 auto 5px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center}
.qs .sc:nth-child(1) .si{background:var(--green-l)}
.qs .sc:nth-child(2) .si{background:var(--red-l)}
.qs .sc:nth-child(3) .si{background:var(--yellow-l)}
.sc .sv{font-size:18px;font-weight:700;color:var(--tx)}
.qs .sc:nth-child(1) .sv{color:var(--green-deep)}
.qs .sc:nth-child(2) .sv{color:var(--red-deep)}
.qs .sc:nth-child(3) .sv{color:var(--yellow-deep)}
.sc .sl{font-size:10px;color:var(--tx2);margin-top:2px}
/* —— 区块标题：左侧小砖块图标 —— */
.sec{padding:0 14px;margin-bottom:16px}
.st{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.st::before{content:'';width:16px;height:11px;border-radius:3px;background-color:var(--red);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5) 0 2px,transparent 2.6px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.5) 0 2px,transparent 2.6px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);flex-shrink:0}
/* —— 主操作按钮：记录分数=红砖（顶部凸点），兑换积分=黄砖 —— */
.add-btn{position:relative;overflow:hidden;background:var(--red);color:#fff;border:none;border-radius:var(--r-btn);padding:13px 8px;font-size:15px;font-weight:700;width:100%;cursor:pointer;box-shadow:var(--sh-red);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,box-shadow .15s}
.add-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:8px;background-image:radial-gradient(circle at 9px 0,rgba(255,255,255,.32) 0 4px,transparent 4.8px);background-size:18px 8px;background-position:center top;background-repeat:repeat-x;pointer-events:none}
.add-btn:active{transform:scale(.97)}
.add-btn .ab-icon{font-size:18px}
.add-btn.ex{background:var(--yellow);color:var(--yellow-deep);box-shadow:var(--sh-yellow)}
.add-btn.ex::before{background-image:radial-gradient(circle at 9px 0,rgba(255,255,255,.4) 0 4px,transparent 4.8px)}
/* —— 记录列表 —— */
.rl{display:flex;flex-direction:column;gap:8px}
.ri{background:var(--card);border-radius:var(--r-card);padding:11px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.ri:active{transform:scale(.985)}
.ri .ic{width:36px;height:36px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ri .ic.u{background:var(--green-l)}
.ri .ic.d{background:var(--red-l)}
.ri .ic.e{background:var(--yellow-l)}
.ri .inf{flex:1;min-width:0}
.ri .nm{font-size:13px;font-weight:600}
.ri .tm{font-size:10px;color:var(--tx2);margin-top:1px}
.ri .sc2{font-size:16px;font-weight:700;flex-shrink:0}
.ri .sc2.u{color:var(--green-deep)}
.ri .sc2.d{color:var(--red-deep)}
.ri .dl{width:26px;height:26px;border-radius:8px;background:var(--red-l);border:none;color:var(--red-deep);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* —— 记录页筛选 tabs：选中=蓝 —— */
.ft{display:flex;gap:6px;padding:0 14px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ft::-webkit-scrollbar{display:none}
.ftb{padding:6px 14px;border-radius:18px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;background:var(--card);border:1px solid var(--bd);color:var(--tx2);transition:all .2s;user-select:none}
.ftb.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
/* —— 记录页日期触发条：蓝浅底 —— */
.dateTrigger{background:var(--blue-l);border:1px solid var(--blue-l2);border-radius:var(--r-btn);padding:14px 16px;margin:10px 14px 0;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.dateTriggerText{font-size:14px;color:var(--blue-deep);font-weight:600}
.dateTriggerIcon{font-size:14px;color:var(--blue-deep)}
/* —— 兑换列表：黄砖域 —— */
.sl2{display:flex;flex-direction:column;gap:8px}
.si2{background:var(--card);border-radius:var(--r-card);padding:14px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.si2 .ico{width:44px;height:44px;border-radius:var(--r-btn);display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--yellow-l);flex-shrink:0}
.si2 .info{flex:1}
.si2 .sn{font-size:13px;font-weight:600}
.si2 .sd{font-size:10px;color:var(--tx2);margin-top:1px}
.si2 .co{font-size:14px;font-weight:700;color:var(--yellow-deep);margin-top:3px}
.sb{padding:7px 14px;border-radius:var(--r-sm);background:var(--yellow);color:var(--yellow-deep);border:none;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;box-shadow:var(--sh-yellow)}
.sb:active{transform:scale(.94)}
.sb:disabled{background:var(--gray-l);color:var(--tx2);box-shadow:none;cursor:not-allowed}
/* —— 设置页：分组卡 + 组标题左侧色砖（红/蓝/绿） —— */
.sg{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh);margin-bottom:10px}
.sgh{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:all .2s}
.sgh.open{border-bottom-color:var(--bd)}
.sgh .sgt{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.sgh .sgt .cnt{font-size:11px;color:var(--tx2);font-weight:400}
.sgh .arr{font-size:12px;color:var(--tx2);transition:transform .2s}
.sgh.open .arr{transform:rotate(180deg)}
.sgt.brick-red::before,.sgt.brick-blue::before,.sgt.brick-green::before{content:'';width:14px;height:10px;border-radius:3px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5) 0 1.8px,transparent 2.4px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.5) 0 1.8px,transparent 2.4px);flex-shrink:0}
.sgt.brick-red::before{background-color:var(--red)}
.sgt.brick-blue::before{background-color:var(--blue)}
.sgt.brick-green::before{background-color:var(--green)}
.sgc{padding:0 14px 10px;max-height:0;overflow:hidden;transition:max-height .3s ease,padding .3s ease}
.sgc.open{max-height:2000px;padding:10px 14px 14px}
.sr{background:var(--card);border-radius:var(--r-sm);padding:8px 10px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh-sm);margin-bottom:6px}
.sr .n{flex:1;font-size:12px;word-break:break-all}
.sr .s{font-size:12px;font-weight:700;width:40px;text-align:center;flex-shrink:0}
.sr .s.u{color:var(--green-deep)}
.sr .s.d{color:var(--red-deep)}
.sr .x,.sr .ed{width:22px;height:22px;border-radius:6px;background:var(--gray-l);border:none;color:var(--tx2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* —— 弹窗 —— */
.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:200;display:none;align-items:flex-end;justify-content:center}
.mo.show{display:flex}
.ml{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:0;animation:su .25s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.ml-header{padding:18px 16px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.ml-title{font-size:17px;font-weight:700;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;gap:7px}
.ml-title::before{content:'';width:18px;height:12px;border-radius:3px;background-color:var(--red);background-image:radial-gradient(circle at 30% 28%,rgba(255,255,255,.5) 0 2.2px,transparent 2.9px),radial-gradient(circle at 70% 28%,rgba(255,255,255,.5) 0 2.2px,transparent 2.9px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);flex-shrink:0}
#ms2 .ml-title::before{background-color:var(--yellow)}
#datePicker .ml-title::before{background-color:var(--blue)}
.ml-close{width:30px;height:30px;border-radius:50%;background:var(--cream);border:none;font-size:16px;cursor:pointer;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.ml-body{padding:16px}
/* —— 表单 —— */
.fg{margin-bottom:14px}
.fl{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px;display:block}
.fi{width:100%;padding:11px 14px;border-radius:var(--r-btn);border:1.5px solid var(--bd);font-size:14px;background:var(--card);color:var(--tx);outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--red)}
.fs{width:100%;padding:11px 14px;border-radius:var(--r-btn);border:1.5px solid var(--bd);font-size:14px;background:var(--card);color:var(--tx);outline:none;appearance:none}
.fr{display:flex;gap:10px}
.fr .fg{flex:1}
.bn{width:100%;padding:13px;border-radius:var(--r-btn);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.bn:active{transform:scale(.97)}
.bn.bp{background:var(--red);color:#fff;box-shadow:var(--sh-red)}
#ms2 .bn.bp{background:var(--yellow);color:var(--yellow-deep);box-shadow:var(--sh-yellow)}
.bn.bd2{background:var(--red-deep);color:#fff}
.bsm{width:auto;padding:8px 16px;font-size:13px;border-radius:var(--r-sm)}
/* —— 分类 chip：记录弹窗内选中=红域 —— */
.ct{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ctb{padding:7px 14px;border-radius:var(--r-btn);font-size:13px;cursor:pointer;border:1.5px solid var(--bd);background:var(--card);transition:all .2s;user-select:none}
.ctb.on{border-color:var(--red);background:var(--red-l);color:var(--red-deep);font-weight:600}
/* —— 底部 tabBar：选中=红 + 砖块凸点装饰 —— */
.tb{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--bd);z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.ti{flex:1;padding:8px 0 6px;text-align:center;cursor:pointer;user-select:none;position:relative}
.ti .ti2{font-size:20px}
.ti .tl{font-size:9px;color:var(--tx2);margin-top:1px}
.ti.on .tl{color:var(--red);font-weight:700}
.ti.on::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:30px;height:5px;border-radius:0 0 5px 5px;background-color:var(--red);background-image:radial-gradient(circle at 9px 0,rgba(255,255,255,.45) 0 1.8px,transparent 2.4px),radial-gradient(circle at 21px 0,rgba(255,255,255,.45) 0 1.8px,transparent 2.4px);background-repeat:no-repeat}
.pg{display:none}
.pg.on{display:block}
/* —— 空状态 / toast：奶油白底 + 彩色文字 —— */
.es{text-align:center;padding:36px 16px;color:var(--tx2)}
.ei{font-size:44px;margin-bottom:10px}
.et{font-size:13px;line-height:1.8}
.to{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);color:var(--red-deep);padding:12px 20px;border-radius:var(--r-btn);font-size:13px;font-weight:700;z-index:300;display:none;text-align:center;max-width:80%;box-shadow:var(--sh);border:1.5px solid var(--bd)}
.to.show{display:block;animation:fi .15s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
/* —— 确认弹窗：确定=红砖 —— */
.co2{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:250;display:none;align-items:center;justify-content:center}
.co2.show{display:flex}
.cb{background:var(--card);border-radius:var(--r-card);padding:20px;width:85%;max-width:300px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.ct2{font-size:15px;font-weight:700;margin-bottom:6px}
.cx{font-size:13px;color:var(--tx2);margin-bottom:16px}
.cn{display:flex;gap:8px}
.cn .bn{flex:1}
.bg{background:var(--gray-l);color:var(--tx)}
/* —— 周概览小卡：白格；选中格=红描边+红浅底+黄点 —— */
.sb2{display:flex;gap:5px;justify-content:center;margin:10px 0;overflow-x:auto;padding-bottom:4px}
.sbd{position:relative;min-width:38px;height:42px;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh-sm);flex-shrink:0;cursor:pointer}
.sbd .sdl{font-size:8px;color:var(--tx2)}
.sbd .sdd{font-size:7px;color:var(--tx2);line-height:1}
.sbd .sds{font-size:10px;font-weight:700;color:var(--tx)}
.sbd.hd .sds{color:var(--blue-deep)}
.sbd.tdy{border:2px solid var(--red);background:var(--red-l)}
.sbd.tdy .sdl,.sbd.tdy .sdd{color:var(--red-deep)}
.sbd.tdy::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--yellow);box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
.sbd:active{transform:scale(.92)}
.ei2{background:var(--card);border-radius:var(--r-sm);padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh-sm);margin-bottom:6px}
.ei2 .eic{font-size:18px}
.ei2 .ein{flex:1}

<script>
var SK='***';
var USER_KEY='star_users';
var CURR_KEY='star_current';
var SYNC_API=location.origin;
var GH_TOKEN='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';
var GH_OWNER='wxx-1006';
var GH_REPO='star-points';
var GH_FILE='sync-data.json';
var GH_API='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_FILE;
var syncSHA='';
var currentUser=null;
var syncStatus='idle'; // idle | loading | synced | error
function getUsers(){try{var r=localStorage.getItem(USER_KEY);if(r)return JSON.parse(r)}catch(e){}return[]}
function saveUsers(u){try{localStorage.setItem(USER_KEY,JSON.stringify(u))}catch(e){}}
function getCurrentPhone(){try{return localStorage.getItem(CURR_KEY)||null}catch(e){}return null}
function setCurrentPhone(p){try{localStorage.setItem(CURR_KEY,p)}catch(e){}}
function userKey(phone){return SK+'_'+phone}
function ld(){var phone=currentUser;if(!phone)return gd();try{var r=localStorage.getItem(userKey(phone));if(r)return JSON.parse(r)}catch(e){}return gd()}
function sd(d){var phone=currentUser;if(!phone)return;try{localStorage.setItem(userKey(phone),JSON.stringify(d))}catch(e){};syncPush(d)}
function migrateOldData(phone){try{var old=localStorage.getItem(SK);if(old&&phone){var parsed=JSON.parse(old);if(parsed.records&&parsed.records.length>0){localStorage.setItem(userKey(phone),JSON.stringify(parsed));toast('已迁移历史数据')}}}catch(e){}}

// ===== 数据同步 (GitHub API) =====
function utf8ToB64(str){return btoa(unescape(encodeURIComponent(str)))}
function b64ToUtf8(b64){return decodeURIComponent(escape(atob(b64)))}
function syncPull(phone){
  syncStatus='loading';
  updateSyncUI();
  return fetch(GH_API,{headers:{'Authorization':'token '+GH_TOKEN}})
    .then(function(r){
      if(!r.ok) return {sha:'',content:null};
      return r.json();
    })
    .then(function(meta){
      syncSHA=meta.sha||'';
      if(meta.content){
        try{
          var content=b64ToUtf8(meta.content);
          var allData=JSON.parse(content);
          if(allData && allData[phone]){
            localStorage.setItem(userKey(phone),JSON.stringify(allData[phone]));
          }
        }catch(e){}
      }
      syncStatus='synced';
      updateSyncUI();
      return ld();
    })
    .catch(function(e){
      syncStatus='error';
      updateSyncUI();
      return ld();
    });
}
function syncPush(data){
  if(!currentUser)return;
  fetch(GH_API,{headers:{'Authorization':'token '+GH_TOKEN}})
    .then(function(r){return r.json()})
    .then(function(meta){
      syncSHA=meta.sha||'';
      var allData={};
      if(meta.content){
        try{allData=JSON.parse(b64ToUtf8(meta.content))}catch(e){}
      }
      allData[currentUser]=data;
      var content=utf8ToB64(JSON.stringify(allData));
      return fetch(GH_API,{method:'PUT',headers:{'Authorization':'token '+GH_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({message:'sync:'+currentUser,content:content,sha:syncSHA})});
    })
    .then(function(r){
      if(r.ok){syncStatus='synced';updateSyncUI()}
      else{syncStatus='error';updateSyncUI()}
    })
    .catch(function(){syncStatus='error';updateSyncUI()});
}
function updateSyncUI(){
  var el=document.getElementById('syncStatus');
  if(!el)return;
  if(syncStatus==='loading')el.textContent='⏳';
  else if(syncStatus==='synced')el.textContent='☁️';
  else if(syncStatus==='error')el.textContent='⚠️';
  else el.textContent='';
}
function doSync(){
  if(!currentUser)return;
  syncPull(currentUser).then(function(data){
    ad=data;
    render();
  });
}
var ci={'学习':'📚','生活':'🏠','饮食':'🍽️','品德':'❤️','运动':'🏃','电子产品':'📱','兴趣':'🎨','家务':'🧹'};
var du=[
{id:'up_1',name:'按时完成作业',score:5,category:'学习'},
{id:'up_2',name:'完成额外作业',score:5,category:'学习',unit:'项'},
{id:'up_3',name:'作业全对/优秀',score:10,category:'学习'},
{id:'up_4',name:'被老师表扬',score:10,category:'学习'},
{id:'up_5',name:'主动预习',score:5,category:'学习'},
{id:'up_6',name:'主动复习',score:5,category:'学习'},
{id:'up_7',name:'阅读课外书(≥20分钟)',score:8,category:'学习'},
{id:'up_8',name:'读完一本书并分享',score:15,category:'学习'},

function doLogin(){
  var phone=document.getElementById('loginPhone').value.trim();
  var name=document.getElementById('loginName').value.trim();
  if(!phone||phone.length<11){toast('请输入正确的手机号');return}
  if(!name){toast('请输入姓名');return}
  var users=getUsers();
  var exist=users.find(function(u){return u.phone===phone});
  if(!exist){
    if(users.length>=3){toast('最多支持3个账号');return}
    users.push({phone:phone,name:name});
    saveUsers(users);
  }
  setCurrentPhone(phone);
  currentUser=phone;
  migrateOldData(phone);
  enterApp();
}
function quickLogin(phone){
  currentUser=phone;
  setCurrentPhone(phone);
  migrateOldData(phone);
  enterApp();
}
function enterApp(){
  document.getElementById('loginPage').classList.remove('show');
  document.getElementById('mainHeader').style.display='';
  document.getElementById('userSwitch').style.display='';
  document.getElementById('syncBtn').style.display='';
  var users=getUsers();
  var u=users.find(function(x){return x.phone===currentUser});
  if(u){
    document.getElementById('usAvatar').textContent=u.name.charAt(0);
    document.getElementById('usName').textContent=u.name;
  }
  // 从服务端拉取数据
  syncPull(currentUser).then(function(data){
    ad=data;
    renderAll(ad);
  });
}
function showSwitchModal(){
  var users=getUsers();
  var html='';
  for(var i=0;i<users.length;i++){
    var u=users[i];
    var isCur=u.phone===currentUser;
    html+='<div class="switch-item'+(isCur?' current':'')+'" onclick="switchUser(\''+u.phone+'\')">';
    html+='<div class="switch-avatar">'+u.name.charAt(0)+'</div>';
    html+='<div class="switch-info"><div class="switch-name">'+u.name+'</div><div class="switch-phone">'+u.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2')+'</div></div>';
    if(isCur)html+='<div class="switch-check">✓</div>';
    html+='</div>';
  }
  if(users.length<3)html+='<div class="switch-add" onclick="closeSwitchModal();showLoginPage()">➕ 添加新用户</div>';
  html+='<div class="switch-add" style="color:var(--no)" onclick="doLogout()">🚪 退出登录</div>';
  document.getElementById('switchList').innerHTML=html;
  document.getElementById('switchModal').classList.add('show');
}
document.getElementById('switchModal').addEventListener('click',function(e){
  if(e.target===this)closeSwitchModal();
});
function closeSwitchModal(){document.getElementById('switchModal').classList.remove('show')}
function switchUser(phone){
  currentUser=phone;
  setCurrentPhone(phone);
  var users=getUsers();
  var u=users.find(function(x){return x.phone===phone});
  if(u){
    document.getElementById('usAvatar').textContent=u.name.charAt(0);
    document.getElementById('usName').textContent=u.name;
  }
  closeSwitchModal();
  syncPull(phone).then(function(data){
    ad=data;
    renderAll(ad);
  });
}
function doLogout(){
  closeSwitchModal();
  currentUser=null;
  setCurrentPhone('');
  document.getElementById('userSwitch').style.display='none';
  document.getElementById('syncBtn').style.display='none';
  showLoginPage();
}

function renderHome(){
  document.getElementById('tp').textContent=ad.totalPoints;
  var tr=ad.records.filter(function(r){return r.date===today()});
  var tu=tr.filter(function(r){return r.score>0}).reduce(function(s,r){return s+r.score},0);
  var td2=tr.filter(function(r){return r.score<0}).reduce(function(s,r){return s+Math.abs(r.score)},0);
  var tn=tu-td2;
  document.getElementById('tu').textContent='+'+tu;
  document.getElementById('td').textContent='-'+td2;
  var tpe=document.getElementById('tdp');
  if(tn>0) tpe.innerHTML='今日：<span class="up">+'+tn+'</span>';
  else if(tn<0) tpe.innerHTML='今日：<span class="down">'+tn+'</span>';
  else tpe.textContent='今日：0';

  var sk=0;var dc=new Date();
  while(true){
    var ds=dc.getFullYear()+'-'+String(dc.getMonth()+1).padStart(2,'0')+'-'+String(dc.getDate()).padStart(2,'0');
    if(ad.records.some(function(r){return r.date===ds})){sk++;dc.setDate(dc.getDate()-1)}
    else break;
  }
  document.getElementById('ts').textContent=sk;

  var wb=document.getElementById('wb');wb.innerHTML='';
  var dl=['日','一','二','三','四','五','六'];
  // 近一周概览：滚动 7 天窗口（今天-6 ~ 今天），按时间正序排列，最右为今天
  var ws=new Date();ws.setDate(ws.getDate()-6);
  for(var i=0;i<7;i++){
    var dd2=new Date(ws);dd2.setDate(ws.getDate()+i);
    var ds2=dd2.getFullYear()+'-'+String(dd2.getMonth()+1).padStart(2,'0')+'-'+String(dd2.getDate()).padStart(2,'0');
    var dr2=ad.records.filter(function(r){return r.date===ds2});
    var dn=dr2.reduce(function(s,r){return s+r.score},0);
    var d=document.createElement('div');
    var vd2=selectedDay||today(); // 视图日：蓝框跟随选中格，未选中时停在今天
    var lbl=(ds2===today())?'今天':dl[dd2.getDay()];
    var dstr=(dd2.getMonth()+1)+'/'+dd2.getDate(); // 小字日期，跨自然周/跨月时可区分
    d.className='sbd'+(dr2.length>0?' hd':'')+(vd2===ds2?' tdy':'');
    d.innerHTML='<span class="sdl">'+lbl+'</span><span class="sdd">'+dstr+'</span><span class="sds">'+(dn>0?'+':'')+dn+'</span>';
    d.onclick=(function(ds){return function(){openDayDetail(ds)}})(ds2);
    wb.appendChild(d);
  }

  // 当日记录列表：视图日 = selectedDay || 今天，点击周概览某格即就地切换到那天的记录
  var vd=selectedDay||today();
  var vrecs=ad.records.filter(function(r){return r.date===vd});
  var vexs=ad.exchanges.filter(function(e){return e.date===vd});
  var vitems=[];
  for(var i=0;i<vrecs.length;i++) vitems.push({type:'record',data:vrecs[i]});
  for(var i=0;i<vexs.length;i++) vitems.push({type:'exchange',data:vexs[i]});
  vitems.sort(cmpTimeDesc);

  document.getElementById('trTitle').textContent=dayTitle(vd);
  document.getElementById('backToday').style.display=(vd!==today())?'':'none';

  var trl=document.getElementById('tr');
  if(vitems.length===0){
    trl.innerHTML=(vd===today())
      ?'<div class="es"><div class="ei">🏗️</div><div class="et">今天还没有记录哦<br>点击上方按钮开始加分吧！</div></div>'
      :'<div class="es"><div class="ei">📭</div><div class="et">该日暂无记录</div></div>';
  }else{
    var html2='';
    for(var i=0;i<vitems.length;i++){
      if(vitems[i].type==='record') html2+=renderRecord(vitems[i].data,vd);
      else html2+=renderExchange(vitems[i].data,vd);
    }
    trl.innerHTML=html2;
  }
}

// 当日记录区块标题：视图日为今天 →「今日记录」；其他日子 →「当日记录 · X月X日 周X」
function dayTitle(ds){
  if(ds===today())return'🏗️ 今日记录';
  var p=ds.split('-');
  var d=new Date(ds);
  var w=['周日','周一','周二','周三','周四','周五','周六'];
  return '🏗️ 当日记录 · '+parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日 '+w[d.getDay()];
}

// 记录列表通用排序：按发生日期(data.date)降序，同日期内按录入时间(timestamp)降序。
// 补签记录的 timestamp 是录入时刻而非发生日期，故必须先比 date 才符合用户视角的时间倒序；
// timestamp 缺失（旧版迁移数据）按 0 处理，避免 NaN 导致排序错乱。
function cmpTimeDesc(a,b){
  if(a.data.date!==b.data.date) return a.data.date<b.data.date?1:-1;
  return (b.data.timestamp||0)-(a.data.timestamp||0);
}

function renderRecord(r,currentDay){
  var u=r.score>0;
  var cls=u?'u':'d';
  var ico=u?'✅':'⚠️';
  var sign=u?'+':'';
  var noteStr=r.note?(' · '+r.note):'';
  var timeStr=(r.date===currentDay)?fdt(r.timestamp):fd(r.date)+' '+fdt(r.timestamp);
  return '<div class="ri"><div class="ic '+cls+'">'+ico+'</div><div class="inf"><div class="nm">'+r.name+'</div><div class="tm">'+timeStr+noteStr+'</div></div><div class="sc2 '+cls+'">'+sign+r.score+'</div><button class="dl" onclick="deleteRecord(\''+r.id+'\')">✕</button></div>';
}

function renderExchange(e,currentDay){
  var timeStr=(e.date===currentDay)?fdt(e.timestamp):fd(e.date)+' '+fdt(e.timestamp);
  return '<div class="ri"><div class="ic e">🎁</div><div class="inf"><div class="nm">'+e.name+'</div><div class="tm">'+timeStr+' · 兑换</div></div><div class="sc2 d">-'+e.cost+'</div></div>';
}

  for(var i=0;i<types.length;i++){
    typeHtml+='<div class="ftb'+(curTypeFilter===types[i]?' on':'')+'" onclick="setTypeFilter(\''+types[i]+'\')">'+types[i]+'</div>';
  }
  document.getElementById('typeFilter').innerHTML=typeHtml;

  var allItems=[];
  for(var i=0;i<ad.records.length;i++){
    allItems.push({type:'record',data:ad.records[i]});
  }
  for(var i=0;i<ad.exchanges.length;i++){
    allItems.push({type:'exchange',data:ad.exchanges[i]});
  }

  if(curTypeFilter==='得分') allItems=allItems.filter(function(item){return item.type==='record'&&item.data.score>0});
  else if(curTypeFilter==='扣分') allItems=allItems.filter(function(item){return item.type==='record'&&item.data.score<0});
  else if(curTypeFilter==='兑换') allItems=allItems.filter(function(item){return item.type==='exchange'});

  if(dateRangeStart) allItems=allItems.filter(function(item){return item.data.date>=dateRangeStart});
  if(dateRangeEnd) allItems=allItems.filter(function(item){return item.data.date<=dateRangeEnd});

  allItems.sort(cmpTimeDesc);

  var ar=document.getElementById('ar');
  if(allItems.length===0) ar.innerHTML='<div class="es"><div class="ei">📭</div><div class="et">这个时间段还没有记录</div></div>';
  else{
    var html='';
    for(var i=0;i<allItems.length;i++){
      if(allItems[i].type==='record') html+=renderRecord(allItems[i].data,today());
      else html+=renderExchange(allItems[i].data,today());
    }
    ar.innerHTML=html;
  }
}

function renderSettings(){
  document.getElementById('upCnt').textContent='('+ad.upItems.length+'项)';
  document.getElementById('downCnt').textContent='('+ad.downItems.length+'项)';
  document.getElementById('shopCnt').textContent='('+ad.shopItems.length+'项)';

  document.getElementById('sui').innerHTML=renderGroupedItems(ad.upItems,'up','up_main');
  document.getElementById('sdi').innerHTML=renderGroupedItems(ad.downItems,'down','down_main');

  var html='';
  for(var i=0;i<ad.shopItems.length;i++){
    var it=ad.shopItems[i];
    html+='<div class="sr"><span class="n">'+it.icon+' '+it.name+'</span><span class="s">'+it.cost+'分</span><button class="ed" onclick="editShopItem(\''+it.id+'\')">✎</button><button class="x" onclick="deleteItem(\'shop\',\''+it.id+'\')">✕</button></div>';
  }
  document.getElementById('ssi').innerHTML=html;

  // 恢复主section展开状态
  var sections=[
    {idx:1,stateKey:'up_main'},
    {idx:2,stateKey:'down_main'},
    {idx:3,stateKey:'shop_main'}
  ];
  for(var i=0;i<sections.length;i++){
    var sec=sections[i];
    var sgh=document.querySelector('#p-settings .sec:nth-child('+sec.idx+') .sg .sgh');
    var sgc=document.querySelector('#p-settings .sec:nth-child('+sec.idx+') .sg .sgc');
    if(sgh&&sgc){
      var isOpen=sectionState[sec.stateKey]===true;
      if(isOpen){sgh.classList.add('open');sgc.classList.add('open')}
      else{sgh.classList.remove('open');sgc.classList.remove('open')}
    }
  }
}

function renderGroupedItems(items,type,stateKey){
  var groups={};
  var order=[];
  for(var i=0;i<items.length;i++){
    var c=items[i].category;
    if(!groups[c]){groups[c]=[];order.push(c)}
    groups[c].push(items[i]);
  }
  var html='';
  for(var j=0;j<order.length;j++){
    var cat=order[j];
    var icon=ci[cat]||'📌';
    var isOpen=sectionState[stateKey+'_'+cat]===true;
    html+='<div class="sg" style="margin-bottom:8px;box-shadow:none;border:1px solid var(--bd)">';
    html+='<div class="sgh'+(isOpen?' open':'')+'" onclick="toggleSection(this,\''+stateKey+'_'+cat+'\')" style="padding:10px 12px">';
    html+='<div class="sgt" style="font-size:13px">'+icon+' '+cat+' <span class="cnt">('+groups[cat].length+'项)</span></div>';
    html+='<span class="arr">▼</span>';
    html+='</div>';
    html+='<div class="sgc'+(isOpen?' open':'')+'">';
    for(var k=0;k<groups[cat].length;k++){
      var it=groups[cat][k];
      var sign=type==='up'?'+':'-';
      html+='<div class="sr"><span class="n">'+it.name+'</span><span class="s '+(type==='up'?'u':'d')+'">'+sign+it.score+'</span><button class="ed" onclick="editItem(\''+type+'\',\''+it.id+'\')">✎</button><button class="x" onclick="deleteItem(\''+type+'\',\''+it.id+'\')">✕</button></div>';
    }
    html+='</div></div>';
  }
  return html;
}

function toggleSection(header,stateKey){
  var content=header.nextElementSibling;
  header.classList.toggle('open');
  content.classList.toggle('open');
  if(stateKey){
    sectionState[stateKey]=header.classList.contains('open');
  }
}

function setTypeFilter(t){curTypeFilter=t;renderRecords()}

function openScore(){
  scoreType='up';
  document.getElementById('scoreType').value='up';
  var dateInput=document.getElementById('sdate');
  // 选中日联动：点击过周概览某天且不晚于今天 → 默认该天（补签）；未来日子或未点击 → 默认今天
  var dv=today();
  if(selectedDay && selectedDay<=today()) dv=selectedDay;
  dateInput.value=dv;
  dateInput.min=minRecordDate();
  dateInput.max=today();
  populateCats();
  document.getElementById('sn').value='';
  document.getElementById('ms').classList.add('show');
}

function setScoreType(type){
  scoreType=type;
  document.getElementById('scoreType').value=type;
  populateCats();
}

// 补签最早可选日期：今天往前 6 天（含今天共 7 天）
function minRecordDate(){
  var d=new Date();
  d.setDate(d.getDate()-6);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function populateCats(){
  var items=scoreType==='up'?ad.upItems:ad.downItems;
  var cats=[];var catSet={};
  for(var i=0;i<items.length;i++){
    if(!catSet[items[i].category]){catSet[items[i].category]=true;cats.push(items[i].category)}
  }
  var catHtml='';
  for(var i=0;i<cats.length;i++){
    catHtml+='<option value="'+cats[i]+'">'+(ci[cats[i]]||'')+' '+cats[i]+'</option>';
  }
  document.getElementById('scat').innerHTML=catHtml;
  if(cats.length>0) selectCat(cats[0]);
}

function selectCat(cat){
  document.getElementById('scat').value=cat;
  var items=scoreType==='up'?ad.upItems:ad.downItems;
  var html='';
  for(var i=0;i<items.length;i++){
    if(items[i].category===cat){
      var unitStr=(items[i].unit)?('/'+items[i].unit):'';
      html+='<option value="'+items[i].id+'" data-score="'+items[i].score+'">'+items[i].name+' ('+items[i].score+'分'+unitStr+')</option>';
    }
  }
  document.getElementById('sis').innerHTML=html;
  if(html){
    for(var i=0;i<items.length;i++){
      if(items[i].category===cat){document.getElementById('sv').value=items[i].score;break}
    }
  }
}

document.addEventListener('change',function(e){
  if(e.target.id==='sis'){
    var o=e.target.options[e.target.selectedIndex];
    if(o) document.getElementById('sv').value=o.dataset.score||5;
  }
});

function ss(){
  var sis=document.getElementById('sis');
  var items=scoreType==='up'?ad.upItems:ad.downItems;
  var it=null;
  for(var i=0;i<items.length;i++){if(items[i].id===sis.value){it=items[i];break}}
  if(!it){toast('请选择项目');return}
  var sv=parseInt(document.getElementById('sv').value)||0;
  var sn=document.getElementById('sn').value.trim();
  if(sv<=0){toast('分值必须大于0');return}
  var dateInput=document.getElementById('sdate');
  var recDate=dateInput.value||today();
  if(recDate>today()){toast('日期不能晚于今天');return}
  if(recDate<minRecordDate()){toast('只能补录最近7天内的记录');return}
  var rec={id:'r_'+Date.now(),date:recDate,timestamp:Date.now(),type:scoreType,itemId:it.id,name:it.name,category:it.category,score:scoreType==='up'?sv:-sv,note:sn};
  ad.records.push(rec);
  ad.totalPoints+=rec.score;
  sd(ad);
  document.getElementById('ms').classList.remove('show');
  toast(scoreType==='up'?('✅ +'+sv+'分！'):'⚠️ -'+sv+'分');
  render();
}

function openExchange(){
  document.getElementById('exScore').textContent=ad.totalPoints;
  var html='';
  for(var i=0;i<ad.shopItems.length;i++){
    var it=ad.shopItems[i];
    var ca=ad.totalPoints>=it.cost;
    html+='<option value="'+it.id+'" data-cost="'+it.cost+'" '+(ca?'': 'disabled')+'>'+it.name+' (-'+it.cost+'分)</option>';
  }
  if(!html) html='<option value="">没有可兑换项</option>';
  document.getElementById('exSelect').innerHTML=html;
  document.getElementById('exCost').textContent='';
  document.getElementById('ms2').classList.add('show');
}

function onExSelectChange(){
  var sel=document.getElementById('exSelect');
  var opt=sel.options[sel.selectedIndex];
  if(opt&&opt.dataset.cost) document.getElementById('exCost').textContent=opt.dataset.cost+' 分';
  else document.getElementById('exCost').textContent='';
}

function confirmExchange(){
  var sel=document.getElementById('exSelect');
  var itemId=sel.value;
  if(!itemId){toast('请选择兑换项');return}
  var it=null;
  for(var i=0;i<ad.shopItems.length;i++){if(ad.shopItems[i].id===itemId){it=ad.shopItems[i];break}}
  if(!it||ad.totalPoints<it.cost){toast('积分不足！');return}
  sc2('确认兑换','用 '+it.cost+' 积分兑换「'+it.name+'」？',function(){
    ad.totalPoints-=it.cost;
    ad.exchanges.push({id:'ex_'+Date.now(),date:today(),timestamp:Date.now(),shopItemId:itemId,name:it.name,icon:it.icon,cost:it.cost});
    sd(ad);
    toast('🎉 兑换成功！剩余 '+ad.totalPoints+' 分');
    document.getElementById('ms2').classList.remove('show');
    render();
  });
}

function deleteRecord(id){
  var r=null;
  for(var i=0;i<ad.records.length;i++){if(ad.records[i].id===id){r=ad.records[i];break}}
  if(!r)return;
  var sign=r.score>0?'+':'';
  var action=r.score>0?'减少':'增加';
  sc2('删除记录','删除「'+r.name+'」('+sign+r.score+'分)？总分将'+action+Math.abs(r.score)+'分。',function(){
    ad.totalPoints-=r.score;
    ad.records=ad.records.filter(function(x){return x.id!==id});
    sd(ad);
    toast('已删除');
    render();
  });
}

  if(!n){toast('请输入名称');return}
  if(scv<=0){toast('分值必须大于0');return}
  var editId=document.getElementById('editId').value;
  if(editId){
    // 编辑模式
    var items=ad.upItems.concat(ad.downItems);
    for(var i=0;i<items.length;i++){

        items[i].name=n;items[i].score=scv;items[i].category=cat;break;

    var t=isUp?ad.upItems:ad.downItems;
    t.push({id:(isUp?'up_':'down_')+Date.now(),name:n,score:scv,category:cat});
  }
  sd(ad);
  document.getElementById('ma').classList.remove('show');
  toast('✅ 保存成功');

function openDatePicker(){

}

function closeDatePicker(){

function renderCalendars(){
  document.getElementById('singleCalendar').innerHTML=renderMonthCalendar(dpMonth);
}

function renderMonthCalendar(month){
  var year=month.getFullYear();
  var m=month.getMonth();
  var months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var weekDays=['日','一','二','三','四','五','六'];
  var firstDay=new Date(year,m,1);
  var startDay=firstDay.getDay();
  var daysInMonth=new Date(year,m+1,0).getDate();
  var daysInPrevMonth=new Date(year,m,0).getDate();
  var todayStr=today();
  var html='<div class="dp-header"><div class="dp-month">'+year+'年 '+months[m]+'</div><div class="dp-nav">';
  html+='<button class="dp-navbtn" onclick="prevMonth()">‹</button>';
  html+='<button class="dp-navbtn" onclick="nextMonth()">›</button>';
  html+='</div></div>';
  html+='<div class="dp-week">';
  for(var i=0;i<7;i++) html+='<div class="dp-weekday">'+weekDays[i]+'</div>';
  html+='</div>';
  html+='<div class="dp-days">';
  var totalCells=Math.ceil((startDay+daysInMonth)/7)*7;
  for(var i=0;i<totalCells;i++){
    var dayNum=i-startDay+1;
    var cellMonth=m;
    var cellYear=year;
    if(dayNum<=0){cellMonth=m-1;if(cellMonth<0){cellMonth=11;cellYear++}dayNum=daysInPrevMonth+dayNum}
    else if(dayNum>daysInMonth){cellMonth=m+1;if(cellMonth>11){cellMonth=0;cellYear++}dayNum=dayNum-daysInMonth}
    var dateStr=cellYear+'-'+String(cellMonth+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0');
    var classes='dp-day';
    if(cellMonth!==m) classes+=' other';
    if(dateStr===todayStr) classes+=' today';
    if(dpSelectedStart&&dateStr===dpSelectedStart) classes+=' selected';
    if(dpSelectedEnd&&dateStr===dpSelectedEnd) classes+=' selected';
    if(dpSelectedStart&&dpSelectedEnd&&dateStr>dpSelectedStart&&dateStr<dpSelectedEnd) classes+=' inrange';
    else if(dpSelectedStart&&!dpSelectedEnd&&dateStr>dpSelectedStart) classes+=' inrange';
    html+='<div class="'+classes+'" onclick="selectDate(\''+dateStr+'\')">'+dayNum+'</div>';
  }
  html+='</div>';
  return html;
}

function prevMonth(){dpMonth.setMonth(dpMonth.getMonth()-1);renderCalendars()}
function nextMonth(){dpMonth.setMonth(dpMonth.getMonth()+1);renderCalendars()}

function selectDate(dateStr){
  if(!dpSelectedStart||(dpSelectedStart&&dpSelectedEnd)){
    dpSelectedStart=dateStr;
    dpSelectedEnd=null;
  }else{
    if(dateStr<dpSelectedStart){dpSelectedEnd=dpSelectedStart;dpSelectedStart=dateStr}
    else{dpSelectedEnd=dateStr}
    dateRangeStart=dpSelectedStart;
    dateRangeEnd=dpSelectedEnd;
    closeDatePicker();
    renderRecords();
    return;
  }
  renderCalendars();
}

})();
